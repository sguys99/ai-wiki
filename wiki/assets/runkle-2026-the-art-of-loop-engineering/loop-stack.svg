<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 46 828 648" width="828" height="648" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="46" y="46" width="828" height="648" fill="#ffffff"/>
  <g filter="url(#sketch)" stroke-linecap="round">
    <rect x="70" y="70" width="780" height="600" rx="10" ry="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><rect x="130" y="145" width="660" height="460" rx="10" ry="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><rect x="190" y="220" width="540" height="310" rx="10" ry="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><rect x="270" y="320" width="380" height="150" rx="10" ry="10" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2"/>
    
  </g>
  <g>
    <text x="84.0" y="95.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="84.0" dy="0.00">Loop 4 · Hill Climbing — 개선을 자동화 (LangSmith Engine)</tspan></text><text x="144.0" y="170.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="144.0" dy="0.00">Loop 3 · Event-Driven — 백그라운드 자율 실행 (Fleet / LangSmith Deploy)</tspan></text><text x="204.0" y="245.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle"><tspan x="204.0" dy="0.00">Loop 2 · Verification — 품질·일관성 보장 (RubricMiddleware)</tspan></text><text x="460.0" y="372.5" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" dy="0.00">Loop 1 · Agent</tspan><tspan x="460.0" dy="22.50">Model ⇄ Tools 반복</tspan><tspan x="460.0" dy="22.50">(create_agent)</tspan></text><text x="90.0" y="638.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="13" fill="#495057" text-anchor="start" dominant-baseline="middle"><tspan x="90.0" dy="0.00">바깥 루프일수록 더 많이 자동화한다. Loop 1~3은 &quot;실행&quot;을, Loop 4는 &quot;개선 자체&quot;를 자동화 —</tspan><tspan x="90.0" dy="16.25">복귀 경로가 처음으로 돌아가지 않고 안쪽 agent loop을 직접 고친다.</tspan></text>
  </g>
</svg>

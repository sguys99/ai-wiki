  <g>
    <text x="415.0" y="142.5" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="415.0" dy="0.00">Agent 실행</tspan><tspan x="415.0" dy="20.00">(Loop 1~3)</tspan></text><text x="725.0" y="143.8" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="725.0" dy="0.00">Trace</tspan><tspan x="725.0" dy="17.50">행동·도구·grader 기록</tspan></text><text x="725.0" y="330.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="725.0" dy="0.00">LangSmith Engine</tspan><tspan x="725.0" dy="17.50">trace 분석 ·</tspan><tspan x="725.0" dy="17.50">반복 문제 탐지</tspan></text><text x="415.0" y="338.1" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle"><tspan x="415.0" dy="0.00">Harness 개선</tspan><tspan x="415.0" dy="18.75">prompt · tool · grader</tspan></text><text x="569.0" y="152.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" dominant-baseline="middle"><tspan x="569.0" dy="0.00">매 실행이 남김</tspan></text><text x="725.0" y="246.5" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" dominant-baseline="middle"><tspan x="725.0" dy="0.00">수집</tspan></text><text x="571.0" y="347.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" dominant-baseline="middle"><tspan x="571.0" dy="0.00">개선안</tspan></text><text x="415.0" y="247.5" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="12" fill="#e8590c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" dominant-baseline="middle"><tspan x="415.0" dy="0.00">안쪽 루프에 직접 적용 (재시작 아님)</tspan></text><text x="250.0" y="438.0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif" font-size="13" fill="#495057" text-anchor="start" dominant-baseline="middle"><tspan x="250.0" dy="0.00">핵심: 복귀 경로가 시작점이 아니라 agent loop 내부로 침투한다.</tspan><tspan x="250.0" dy="16.25">바깥 루프가 한 바퀴 돌 때마다 안쪽 메커니즘의 효율이 올라간다.</tspan></text>

<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 D 지층</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/mock-base.css">
<style>
  /* 지층: 가로는 연도, 세로는 카테고리 층. 판(패널, 검색)은 공용 크롬 그대로 */
  :root { --gutter: 168px; --plot-top: 104px; }

  /* 상단 바 안의 축 모드 전환 */
  .st-seg { display: inline-flex; gap: 4px; }
  .st-seg .mk-chip { height: 28px; }

  /* 무대 위 첫 줄: 검색 + 유형 칩 */
  .st-controls {
    display: flex; align-items: center; gap: var(--space-2);
    right: var(--space-4); /* is-tl 에 오른쪽 끝을 더해 칩 줄이 넘치면 그 안에서만 스크롤 */
  }
  .st-controls .mk-search { flex: none; }
  .st-types {
    display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none;
  }
  .st-types::-webkit-scrollbar { display: none; }
  .st-types .mk-chip { flex: none; }

  /* 층 머리: 범례이자 필터. 캔버스의 층 띠와 같은 높이에 붙는다 */
  .st-lanes { position: absolute; left: 0; top: 0; width: var(--gutter); margin: 0; padding: 0; list-style: none; z-index: 5;
    height: 100%; pointer-events: none; clip-path: inset(var(--plot-top) 0 0 0); /* 팬한 층 머리가 검색 줄 위로 새지 않게 */ }
  .st-lane {
    pointer-events: auto;
    position: absolute; left: 0; width: 100%;
    display: flex; align-items: flex-start; gap: var(--space-2);
    padding: 10px 14px 0 var(--space-4);
    font-size: 0.8125rem; line-height: var(--leading-tight);
    color: var(--muted); background: none; border: 0; text-align: left; cursor: pointer;
    transition: color var(--dur-fast) var(--ease), top var(--dur-camera) var(--ease-out), height var(--dur-camera) var(--ease-out);
  }
  .st-lane .mk-swatch { margin-top: 4px; }
  .st-lane-name { flex: 1; min-width: 0; color: var(--text); font-weight: 500; }
  .st-lane-n { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .st-lane:hover .st-lane-name { color: var(--c); }
  .st-lane[aria-expanded='false'] { padding-top: 3px; }
  .st-lane[aria-expanded='false'] .st-lane-name { color: var(--faint); font-weight: 400; }
  .st-lane[aria-expanded='false'] .mk-swatch { opacity: 0.45; }
  .st-lane:focus-visible { outline-offset: -2px; }

  /* 패널: 축 띠 아래에서 시작해 연도 눈금을 가리지 않는다 */
  .mk-panel { top: 60px; }
  .st-lineage { margin: 0; color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .st-lineage b { font-weight: 500; color: var(--text); font-family: var(--font-mono); font-size: var(--text-2xs); }
  .mk-neighbors li { align-items: center; }
  .mk-neighbors .st-yr { width: 34px; flex: none; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--faint); font-variant-numeric: tabular-nums; }
  .mk-neighbors .st-t { flex: 1; min-width: 0; }
  .mk-neighbors .st-dir { width: 12px; flex: none; color: var(--faint); font-size: var(--text-2xs); text-align: center; }
  .mk-neighbors li[data-focus='true'] { color: var(--c); background: var(--surface-2); }
  .mk-neighbors li.is-yr-start { border-top: var(--hairline-w) solid var(--muted); }

  .st-empty { position: absolute; left: 0; right: 0; top: 45%; text-align: center; color: var(--muted); font-size: var(--text-sm); pointer-events: none; }

  @media (max-width: 640px) {
    :root { --gutter: 30px; --plot-top: 128px; }
    .st-controls { flex-wrap: wrap; }
    .st-controls .mk-search { width: 100%; }
    .st-types { width: 100%; }
    .st-lane { padding: 8px 0 0 11px; }
    .st-lane-name, .st-lane-n { display: none; }
    .mk-panel { top: auto; }
    .st-seg .mk-chip { padding: 0 8px; }
  }
</style>
<script src="shared/graph-data.js"></script>
<script src="shared/mock-base.js"></script>
</head>
<body>
<header class="mk-bar">
  <h1 class="mk-title">시안 D 지층</h1>
  <span class="mk-subtitle" id="mk-stats"></span>
  <div class="mk-bar-end">
    <div class="st-seg" role="group" aria-label="연도축 너비">
      <button type="button" class="mk-chip" data-mode="volume" aria-pressed="true" title="연도 칸 너비를 그 해 페이지 수에 맞춘다">분량 비례</button>
      <button type="button" class="mk-chip" data-mode="equal" aria-pressed="false" title="모든 연도 칸을 같은 너비로 둔다">연도 균등</button>
    </div>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="테마 전환" aria-pressed="false">☀</button>
  </div>
</header>

<main class="mk-stage" id="stage">
  <canvas id="canvas" aria-label="연도와 카테고리로 나눈 wiki 페이지 지층도"></canvas>

  <ul class="st-lanes" id="lanes" aria-label="카테고리 층. 누르면 접는다"></ul>

  <div class="mk-float is-tl st-controls">
    <div class="mk-search">
      <label class="mk-sr" for="q">페이지 검색</label>
      <input id="q" type="search" placeholder="페이지 제목으로 찾기" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
      <ul class="mk-results mk-glass" id="results" role="listbox" hidden></ul>
    </div>
    <div class="st-types" id="types" role="group" aria-label="자료 유형 필터"></div>
  </div>

  <div class="mk-tip" id="tip" hidden></div>
  <div class="st-empty" id="empty" hidden>모든 층을 접었다. 왼쪽 층 이름을 눌러 다시 편다</div>

  <aside class="mk-panel mk-glass" id="panel" hidden aria-label="선택한 페이지">
    <div class="mk-panel-head">
      <div style="display:flex;align-items:center">
        <span class="mk-panel-cat" id="p-cat"><span class="mk-swatch"></span><span id="p-cat-name"></span></span>
        <button type="button" class="mk-icon-btn" id="p-close" aria-label="선택 해제">×</button>
      </div>
      <h2 class="mk-panel-title" id="p-title"></h2>
      <div class="mk-panel-meta" id="p-meta"></div>
    </div>
    <div class="mk-panel-body">
      <div class="mk-tags" id="p-tags"></div>
      <h3 class="mk-panel-section">이웃 페이지</h3>
      <p class="st-lineage" id="p-lineage"></p>
      <ul class="mk-neighbors" id="p-neighbors" style="margin-top:8px"></ul>
    </div>
    <div class="mk-panel-foot"><a class="mk-btn is-primary" id="p-open" href="#">페이지 열기</a></div>
  </aside>
</main>

<script>
(function () {
  'use strict';
  var data = window.GRAPH_DATA;
  var CATS = Mock.CATEGORIES;
  var nodes = data.nodes.map(function (n) { return Object.assign({}, n); });
  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; n.nb = []; n.out = {}; });
  var edges = [];
  data.edges.forEach(function (e) {
    var s = byId[e.source], t = byId[e.target];
    if (!s || !t) return;
    edges.push({ s: s, t: t });
    s.out[t.id] = true;
    if (s.nb.indexOf(t) < 0) s.nb.push(t);
    if (t.nb.indexOf(s) < 0) t.nb.push(s);
  });

  var Y0 = Infinity, Y1 = -Infinity;
  nodes.forEach(function (n) { Y0 = Math.min(Y0, n.year); Y1 = Math.max(Y1, n.year); });
  var YEARS = [];
  for (var y = Y0; y <= Y1; y++) YEARS.push(y);
  var yearCount = {}; nodes.forEach(function (n) { yearCount[n.year] = (yearCount[n.year] || 0) + 1; });
  var catCount = {}; nodes.forEach(function (n) { catCount[n.category] = (catCount[n.category] || 0) + 1; });
  var typeCount = {}; nodes.forEach(function (n) { typeCount[n.type] = (typeCount[n.type] || 0) + 1; });

  document.getElementById('mk-stats').textContent =
    '페이지 ' + nodes.length + '개, 연결 ' + edges.length.toLocaleString() + '개, ' + Y0 + '년부터 ' + Y1 + '년까지';

  // ── DOM ──────────────────────────────────────────────────────────────
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var tip = document.getElementById('tip');
  var panel = document.getElementById('panel');
  var lanesEl = document.getElementById('lanes');
  var q = document.getElementById('q');
  var results = document.getElementById('results');
  var tokens = Mock.readTokens();
  var reduce = Mock.reduceMotion();

  lanesEl.innerHTML = CATS.map(function (c) {
    return '<li><button type="button" class="st-lane" data-cat="' + c.id + '" aria-expanded="true" aria-label="' + c.en + ' 층 ' + (catCount[c.id] || 0) + '개, 눌러서 접기">' +
      '<span class="mk-swatch"></span><span class="st-lane-name">' + c.en + '</span><span class="st-lane-n">' + (catCount[c.id] || 0) + '</span></button></li>';
  }).join('');
  var laneBtns = {};
  lanesEl.querySelectorAll('.st-lane').forEach(function (b) { laneBtns[b.dataset.cat] = b; });

  var TYPES = Object.keys(typeCount).sort(function (a, b) { return typeCount[b] - typeCount[a]; });
  document.getElementById('types').innerHTML = TYPES.map(function (t) {
    return '<button type="button" class="mk-chip" data-type="' + t + '" aria-pressed="false">' + t + '<span class="mk-chip-count">' + typeCount[t] + '</span></button>';
  }).join('');

  // ── 상태 ────────────────────────────────────────────────────────────
  var mode = 'volume';
  var collapsed = {};
  var typeOn = {};          // 비어 있으면 모든 유형
  var sel = null, hover = null, catHover = null, focusIdx = -1, nbList = [];
  var cam = { k: 1, tx: 0, ty: 0 };
  var fitK = 1;
  var W = 0, H = 0, G = 168, PT = 104, PB = 40;
  var lanes = {};           // cat -> {top, h}
  var cols = [];            // {year, x0, w, n}
  var worldW = 1, contentH = 1;
  var reveal = reduce ? 1 : 0;
  var anim = null;          // 위치 전환
  var mobile = false;

  function rBase(n) { return Math.min(20, 2 + 1.6 * Math.sqrt(n.degree)); }
  function visibleType(n) { return !Object.keys(typeOn).length || typeOn[n.type]; }

  // ── 배치 ────────────────────────────────────────────────────────────
  // 층 높이는 sqrt(개수)에 비례. 칸 안은 연결 수 순으로 왼쪽부터 퇴적시키듯 쌓는다.
  // 연도 칸 너비는 그 해 가장 두꺼운 칸이 정한다 (분량 비례). 월 정보가 없어 칸 안 가로 순서는 시간이 아니다.
  var rs = 1;
  function layout() {
    var avail = H - PT - PB;
    rs = Math.max(0.62, Math.min(1, avail / 700));
    var openCats = CATS.filter(function (c) { return !collapsed[c.id]; });
    var fixed = (CATS.length - openCats.length) * 24;
    var wsum = 0; openCats.forEach(function (c) { wsum += Math.sqrt(catCount[c.id] || 0) + 1.6; });
    var top = 0;
    CATS.forEach(function (c) {
      var h = collapsed[c.id] ? 24 : Math.max(44, (avail - fixed) * (Math.sqrt(catCount[c.id] || 0) + 1.6) / wsum);
      lanes[c.id] = { top: top, h: h };
      top += h;
    });
    contentH = top;

    // 칸별 패킹 (지역 좌표)
    var cellW = {};
    YEARS.forEach(function (yr) { cellW[yr] = 0; });
    CATS.forEach(function (c) {
      var L = lanes[c.id];
      YEARS.forEach(function (yr) {
        var list = nodes.filter(function (n) { return n.category === c.id && n.year === yr; })
          .sort(function (a, b) { return b.degree - a.degree || a.title.localeCompare(b.title); });
        if (collapsed[c.id]) {
          list.forEach(function (n) { n.lx = 0; n.ly = L.top + L.h / 2; n.hidden = true; });
          return;
        }
        var placed = [], lastX = 0, step = 1.5, pad = 7, mid = L.h / 2, maxX = 0;
        list.forEach(function (n) {
          n.hidden = false;
          var r = rBase(n) * rs, rr = r + 1.6;
          var ylo = L.top + Math.min(pad + rr, mid), yhi = L.top + Math.max(L.h - pad - rr, mid);
          var ys = [];
          for (var d = 0; ; d += step) {
            var a = L.top + mid - d, b = L.top + mid + d, any = false;
            if (a >= ylo) { ys.push(a); any = true; }
            if (d > 0 && b <= yhi) { ys.push(b); any = true; }
            if (!any) break;
          }
          if (!ys.length) ys.push(L.top + mid);
          var found = null;
          for (var x = Math.max(rr, lastX - 44); !found; x += step) {
            for (var i = 0; i < ys.length; i++) {
              var ok = true;
              for (var j = placed.length - 1; j >= 0; j--) {
                var p = placed[j], dx = p.x - x, dy = p.y - ys[i], m = p.rr + rr;
                if (dx * dx + dy * dy < m * m) { ok = false; break; }
              }
              if (ok) { found = { x: x, y: ys[i] }; break; }
            }
          }
          placed.push({ x: found.x, y: found.y, rr: rr });
          lastX = Math.max(lastX, found.x);
          n.lx = found.x; n.ly = found.y;
          maxX = Math.max(maxX, found.x + rr);
        });
        cellW[yr] = Math.max(cellW[yr], maxX);
      });
    });

    // 연도 칸
    var CP = 12, x0 = 0;
    var volW = YEARS.map(function (yr) { return cellW[yr] ? cellW[yr] + CP * 2 : 22; });
    var total = volW.reduce(function (a, b) { return a + b; }, 0);
    var eqW = total / YEARS.length;
    cols = YEARS.map(function (yr, i) {
      var w = mode === 'volume' ? volW[i] : eqW;
      var c = { year: yr, x0: x0, w: w, n: yearCount[yr] || 0, inner: cellW[yr] };
      x0 += w;
      return c;
    });
    worldW = x0;
    var colOf = {}; cols.forEach(function (c) { colOf[c.year] = c; });
    nodes.forEach(function (n) {
      var c = colOf[n.year];
      if (mode === 'volume') n.tx = c.x0 + CP + n.lx;
      else {
        // 균등: 넘치는 칸은 가로로 눌러 담는다. 2026 칸이 얼마나 뭉개지는지 그대로 보인다
        var s = Math.min(1, (c.w - CP * 2) / Math.max(1, c.inner));
        var used = c.inner * s;
        n.tx = c.x0 + (c.w - used) / 2 + n.lx * s;
      }
      n.ty = n.ly;
    });
  }

  function commitLayout(animate) {
    nodes.forEach(function (n) { n.fx = n.x; n.fy = n.y; });
    layout();
    if (animate && !reduce && nodes[0].x != null) {
      anim = { t0: performance.now(), dur: 480 };
    } else {
      nodes.forEach(function (n) { n.x = n.tx; n.y = n.ty; });
      anim = null;
    }
  }

  // ── 카메라 ──────────────────────────────────────────────────────────
  function panelOpen() { return !panel.hidden; }
  function viewW() { return W - G - (panelOpen() && !mobile ? 392 : 16); }
  function computeFit() { fitK = Math.max(0.05, (viewW() - 24) / worldW); }
  function clampCam(c) {
    var vw = viewW(), cw = worldW * c.k;
    if (cw <= vw - 24) c.tx = (vw - cw) / 2;
    else c.tx = Math.min(12, Math.max(vw - 12 - cw, c.tx));
    var visBottom = H - PB - (mobile && panelOpen() ? panel.offsetHeight : 0);
    var minTy = Math.min(0, visBottom - PT - contentH);
    c.ty = Math.max(minTy, Math.min(0, c.ty));
    return c;
  }
  function sx(x) { return G + cam.tx + x * cam.k; }
  function sy(y) { return PT + cam.ty + y; }
  function nodeR(n) { return rBase(n) * rs * Math.sqrt(Math.min(1, cam.k)); }

  var camAnim = null;
  function flyTo(target) {
    target = clampCam(target);
    if (reduce) { cam = target; camAnim = null; requestDraw(); return; }
    camAnim = { from: { k: cam.k, tx: cam.tx, ty: cam.ty }, to: target, t0: performance.now() };
    requestDraw();
  }
  function fitAll(animate) {
    computeFit();
    var t = { k: fitK, tx: 0, ty: 0 };
    if (animate) flyTo(t); else cam = clampCam(t);
  }
  function focusNode(n, zoom) {
    // 선택한 페이지와 이웃 전체의 연도 폭을 화면에 맞춘다. 계보가 한 화면에 들어온다
    var lo = n.tx, hi = n.tx;
    n.nb.forEach(function (m) { if (!m.hidden) { lo = Math.min(lo, m.tx); hi = Math.max(hi, m.tx); } });
    var vw = viewW(), k = cam.k;
    if (zoom) k = hi - lo > 1 ? Math.max(fitK, Math.min(fitK * 4, (vw - 120) / (hi - lo))) : Math.max(k, fitK * 2.6);
    var cx = (lo + hi) / 2;
    if (Math.abs(n.tx - cx) * k > vw / 2 - 40) cx = n.tx; // 범위가 화면보다 넓으면 선택 노드를 가운데로
    var t = { k: k, tx: vw / 2 - cx * k, ty: cam.ty };
    if (mobile && panelOpen()) {
      var visBottom = H - panel.offsetHeight;
      var y = PT + n.ty;
      t.ty = Math.min(0, (PT + visBottom) / 2 - y);
    } else t.ty = 0;
    flyTo(t);
  }

  // ── 그리기 ──────────────────────────────────────────────────────────
  var raf = 0;
  function requestDraw() { if (!raf) raf = requestAnimationFrame(frame); }
  var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  function frame(now) {
    raf = 0;
    var more = false;
    if (anim) {
      var p = Math.min(1, (now - anim.t0) / anim.dur), e = ease(p);
      nodes.forEach(function (n) { n.x = n.fx + (n.tx - n.fx) * e; n.y = n.fy + (n.ty - n.fy) * e; });
      if (p >= 1) anim = null; else more = true;
    }
    if (camAnim) {
      var p2 = Math.min(1, (now - camAnim.t0) / 480), e2 = ease(p2);
      ['k', 'tx', 'ty'].forEach(function (key) { cam[key] = camAnim.from[key] + (camAnim.to[key] - camAnim.from[key]) * e2; });
      if (p2 >= 1) camAnim = null; else more = true;
    }
    if (reveal < 1) {
      if (!revealT0) revealT0 = now;
      reveal = Math.min(1, (now - revealT0) / 900);
      more = more || reveal < 1;
    }
    draw();
    if (more) requestDraw();
  }
  var revealT0 = 0;

  function relZoom() { return cam.k / fitK; }
  function degFloor() {
    var z = relZoom();
    if (mobile) z /= 1.8; // 좁은 화면은 한 단계 늦게 드러낸다
    return z < 0.8 ? 50 : z < 1.4 ? 25 : z < 2.2 ? 10 : 0;
  }
  function trunc(s) { return s.length > 28 ? s.slice(0, 27) + '…' : s; }

  function nodeAlpha(n) {
    var a = 1;
    if (sel) a = (n === sel || sel.nb.indexOf(n) >= 0) ? 1 : tokens.dimAlpha;
    else if (catHover) a = n.category === catHover ? 1 : tokens.dimAlpha;
    if (!visibleType(n)) a = Math.min(a, tokens.dimAlpha * 0.8);
    if (reveal < 1) {
      var xn = (n.x / worldW);
      a *= Math.max(0, Math.min(1, (reveal * 1.35 - xn) / 0.35));
    }
    return a;
  }

  function arcCtrl(x1, y1, x2, y2) {
    // 연도축 위로 솟는 호. 같은 칸 안 연결은 옆으로 부푼다
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / d, ny = dx / d;
    if (ny > 0) { nx = -nx; ny = -ny; }   // 늘 위쪽(또는 왼쪽)으로 부푼다
    var bow = Math.min(120, d * 0.28);
    return [mx + nx * bow, my + ny * bow];
  }

  function draw() {
    var t = tokens;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = t.cat[c.id];
      ctx.fillRect(0, y0, W, L.h);

    vis.sort(function (a, b) { return a.degree - b.degree; });

  function drawAggregate() {
    var t = tokens, agg = {};
    edges.forEach(function (e) {
      if (e.s.year === e.t.year || e.s.hidden || e.t.hidden) return;
      if (catHover && e.s.category !== catHover && e.t.category !== catHover) return;
      var a = e.s, b = e.t;
      var key = a.category + a.year + '|' + b.category + b.year;
      var g = agg[key] || (agg[key] = { a: a, b: b, n: 0, ax: 0, ay: 0, bx: 0, by: 0 });
      g.n++; g.ax += a.x; g.ay += a.y; g.bx += b.x; g.by += b.y;

  var matchSet = null;

      for (var i = 0; i < placed.length; i++) {

  function drawAxis() {

  // ── 상호작용 ───────────────────────────────────────────────────────

  }

  function showTip(n, px, py) {

    tip.innerHTML = '<div class="mk-tip-title"></div><div class="mk-tip-meta" data-cat="' + n.category + '"><span class="mk-swatch"></span>' + c.en +
      '<span>' + n.year + '</span><span>' + n.type + '</span><span>연결 ' + n.degree + '</span></div>';

  var pointers = {}, drag = null, pinch = null;

    else if (ids.length === 2) {

  // ── 검색 ───────────────────────────────────────────────────────────
  var hits = [], active = 0;
  function renderResults() {
    var s = q.value.trim().toLowerCase();
    matchSet = null;

    hits = nodes.filter(function (n) { return n.title.toLowerCase().indexOf(s) >= 0 || n.stem.indexOf(s) >= 0; })
      .sort(function (a, b) { return b.degree - a.degree; }).slice(0, 30);
    matchSet = {}; hits.slice(0, 12).forEach(function (n) { matchSet[n.id] = true; });
    active = 0;
    results.innerHTML = hits.length ? hits.map(function (n, i) {
      return '<li role="option" data-i="' + i + '" data-cat="' + n.category + '" aria-selected="' + (i === 0) + '"><span class="mk-swatch"></span><span style="flex:1;min-width:0">' + esc(n.title) + '</span><span class="mk-deg">' + n.year + '</span></li>';
    }).join('') : '<li aria-disabled="true" style="cursor:default;color:var(--muted)">일치하는 페이지가 없다. 영문 제목으로 찾아 본다</li>';
    results.hidden = false; q.setAttribute('aria-expanded', 'true');
    requestDraw();
  }
  function pick(i) {
    var n = hits[i]; if (!n) return;
    results.hidden = true; q.blur();
    select(n, { fly: true, zoom: true });
  }
  q.addEventListener('input', renderResults);
  q.addEventListener('focus', function () { if (q.value) renderResults(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = Math.max(0, Math.min(hits.length - 1, active + (e.key === 'ArrowDown' ? 1 : -1)));
      results.querySelectorAll('li').forEach(function (li) { li.setAttribute('aria-selected', String(+li.dataset.i === active)); if (+li.dataset.i === active) li.scrollIntoView({ block: 'nearest' }); });
    } else if (e.key === 'Enter') { e.preventDefault(); pick(active); }
    else if (e.key === 'Escape') { q.value = ''; renderResults(); q.blur(); }
  });
  results.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  results.addEventListener('click', function (e) { var li = e.target.closest('li[data-i]'); if (li) pick(+li.dataset.i); });
  q.addEventListener('blur', function () { setTimeout(function () { results.hidden = true; }, 0); });

  // ── 필터 ───────────────────────────────────────────────────────────
  function syncLanes() {
    CATS.forEach(function (c) {
      var b = laneBtns[c.id], open = !collapsed[c.id];
      b.setAttribute('aria-expanded', String(open));
      b.setAttribute('aria-label', c.en + ' 층 ' + (catCount[c.id] || 0) + '개, 눌러서 ' + (open ? '접기' : '펴기'));
    });
    document.getElementById('empty').hidden = CATS.some(function (c) { return !collapsed[c.id]; });
  }
  lanesEl.addEventListener('click', function (e) {
    var b = e.target.closest('.st-lane'); if (!b) return;
    var id = b.dataset.cat;
    collapsed[id] = !collapsed[id];
    if (sel && sel.category === id && collapsed[id]) select(null);
    syncLanes();
    commitLayout(true); computeFit(); clampCam(cam); requestDraw();
  });
  lanesEl.addEventListener('pointerover', function (e) {
    var b = e.target.closest('.st-lane');
    var id = b && !collapsed[b.dataset.cat] ? b.dataset.cat : null;
    if (id !== catHover) { catHover = id; requestDraw(); }
  });
  lanesEl.addEventListener('pointerleave', function () { catHover = null; requestDraw(); });

  document.getElementById('types').addEventListener('click', function (e) {
    var b = e.target.closest('.mk-chip'); if (!b) return;
    var t = b.dataset.type;
    if (typeOn[t]) delete typeOn[t]; else typeOn[t] = true;
    b.setAttribute('aria-pressed', String(!!typeOn[t]));
    requestDraw();
  });

  document.querySelectorAll('.st-seg .mk-chip').forEach(function (b) {
    b.addEventListener('click', function () {
      if (mode === b.dataset.mode) return;
      mode = b.dataset.mode;
      document.querySelectorAll('.st-seg .mk-chip').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      commitLayout(true); computeFit();
      flyTo({ k: fitK, tx: 0, ty: cam.ty });
    });
  });

  // ── 크기, 테마, 딥링크 ─────────────────────────────────────────────
  function resize() {
    var r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    mobile = W <= 640;
    var cs = getComputedStyle(document.documentElement);
    G = parseFloat(cs.getPropertyValue('--gutter')) || 168;
    PT = parseFloat(cs.getPropertyValue('--plot-top')) || 104;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var z = cam.k / (fitK || 1);
    commitLayout(false); computeFit();
    cam.k = fitK * (z || 1); clampCam(cam);
    requestDraw();
  }

  function fromHash(fly) {
    var m = /node=([^&]+)/.exec(location.hash);
    var n = m && byId[decodeURIComponent(m[1])];
    if (n && n !== sel) select(n, { fly: true, zoom: true });
  }
  window.addEventListener('hashchange', function () { fromHash(true); });

  Mock.onTheme(function (t) { tokens = t; requestDraw(); });
  window.addEventListener('resize', resize);
  resize();
  fitAll(false);
  fromHash(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { requestDraw(); });
  requestDraw();

  // 자체 점검: 모든 노드가 칸 안에 놓이고 같은 칸에서 겹치지 않는다
  window.__strata = {
    check: function () {
      var bad = 0, placed = 0;
      nodes.forEach(function (n) {
        if (n.hidden) return;
        placed++;
        var L = lanes[n.category];
        if (!(n.ty >= L.top && n.ty <= L.top + L.h) || !isFinite(n.tx)) bad++;
      });
      var overlap = 0;
      if (mode === 'volume') for (var i = 0; i < nodes.length; i++) for (var j = i + 1; j < nodes.length; j++) {
        var a = nodes[i], b = nodes[j];
        if (a.hidden || b.hidden) continue;
        var d = Math.hypot(a.tx - b.tx, a.ty - b.ty);
        if (d < (rBase(a) + rBase(b)) * rs - 0.5) overlap++;
      }
      return { placed: placed, outOfLane: bad, overlaps: overlap, worldW: worldW, fitK: fitK, cols: cols.map(function (c) { return c.year + ':' + Math.round(c.w); }).join(' ') };
    },
    select: function (id) { select(byId[id], { fly: true, zoom: true }); },
    pos: function (id) { var n = byId[id]; return { x: sx(n.x), y: sy(n.y) }; },
    timeDraw: function (k) { var t0 = performance.now(); for (var i = 0; i < k; i++) draw(); return (performance.now() - t0) / k; },
  };
})();
</script>
</body>

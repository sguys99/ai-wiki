<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 F 성도와 궤도</title>
<!-- 초기 테마: 사이트 templates.mjs 의 FOUC 스크립트와 같다 -->
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/mock-base.css">
<style>
  /* ════════════════════════════════════════════════════════════════════
   * F 토큰: 시안 F 전용. shared/mock-base.css 의 같은 이름 토큰을 덮어쓴다.
   * 사이트에 들일 때 이 블록을 styles.css 토큰 층으로 옮긴다 (design-direction.md 3절, 8절).
   * ════════════════════════════════════════════════════════════════════ */
  :root {
    --bg: #070b14;
    --surface: #0f1626;
    --surface-2: #172036;
    --text: #e8ecf5;
    --muted: #8d98ae;
    --faint: #5b6680;
    --hairline: rgba(160, 182, 235, 0.12);
    --signal: #3ef2d2;
    --signal-dim: rgba(62, 242, 210, 0.22);
    --signal-physical: #ffb05a;

    --cat-physical-ai: #ffb05a;
    --cat-agents: #3ef2d2;
    --cat-applications: #ff7298;   /* #ff6aa6 은 제1색각 이상에서 etc 와 겹쳤다 (ΔE 0.1) */
    --cat-database: #c4a2ff;
    --cat-llms: #5e8eff;
    --cat-overviews: #f3f6ff;
    --cat-evaluations: #cdf25a;
    --cat-etc: #7d8ba6;

    --graph-bg: #070b14;
    --graph-edge: #9fb4e0;
    --graph-edge-alpha: 0.07;
    --graph-edge-hi-alpha: 0.85;
    --graph-dim-alpha: 0.14;
    --graph-label: #eef2fa;
    --graph-label-muted: #9aa5bb;
    --graph-label-halo: rgba(6, 10, 19, 0.86);
    --graph-glow-alpha: 0.55;      /* 빛번짐 스프라이트 세기. light 는 0 (그림자로 바뀐다) */
    --graph-ring: #070b14;

    --f-bg-core: #101a31;          /* 무대 중앙의 깊은 남색 */
    --f-bg-edge: #04060c;          /* 가장자리 */
    --f-vignette: rgba(0, 0, 0, 0.55);
    --f-dust: #d4e2ff;             /* 별먼지 */
    --f-dust-alpha: 0.55;
    --f-backdrop-alpha: 0.16;      /* 궤도 화면에서 남는 성도 */
    --f-lens: rgba(8, 13, 25, 0.84);
    --f-filament-blend: lighter;   /* 엣지와 빛번짐을 더하기 합성 */
    --f-shadow-alpha: 0;
    --f-glass: rgba(14, 21, 38, 0.64);
    --f-glass-edge: rgba(200, 216, 255, 0.13);
    --f-glass-top: rgba(255, 255, 255, 0.10);
    --f-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.012) 38%, rgba(255, 255, 255, 0) 100%);
    --f-float-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
    --f-primary-top: #8af8e4;
    --f-primary-bottom: #22d3b6;
    --f-primary-ink: #03141a;

    --glass: var(--f-glass);
    --shadow-float: var(--f-float-shadow);
  }
  :root[data-theme='light'] {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #eef0f6;
    --text: #141a2e;
    --muted: #566079;
    --faint: #8f98ad;
    --hairline: rgba(30, 45, 90, 0.10);
    --signal: #008f78;
    --signal-dim: rgba(0, 143, 120, 0.16);
    --signal-physical: #c25e05;

    --cat-physical-ai: #c25e05;
    --cat-agents: #008f78;
    --cat-applications: #d42a6c;
    --cat-database: #8a46e0;
    --cat-llms: #1e4ac3;
    --cat-overviews: #141a2e;
    --cat-evaluations: #486500;
    --cat-etc: #6b7690;

    --graph-bg: #f3f4f8;
    --graph-edge: #34405e;
    --graph-edge-alpha: 0.075;
    --graph-edge-hi-alpha: 0.78;
    --graph-dim-alpha: 0.16;
    --graph-label: #141a2e;
    --graph-label-muted: #566079;
    --graph-label-halo: rgba(247, 248, 251, 0.92);
    --graph-glow-alpha: 0;
    --graph-ring: #ffffff;

    --f-bg-core: #fdfdfe;
    --f-bg-edge: #e4e7ef;
    --f-vignette: rgba(38, 52, 92, 0.07);
    --f-dust: #26314d;
    --f-dust-alpha: 0.06;
    --f-backdrop-alpha: 0.2;
    --f-lens: rgba(250, 251, 253, 0.86);
    --f-filament-blend: source-over;
    --f-shadow-alpha: 1;
    --f-glass: rgba(255, 255, 255, 0.70);
    --f-glass-edge: rgba(30, 45, 90, 0.09);
    --f-glass-top: rgba(255, 255, 255, 0.95);
    --f-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.15) 40%, rgba(255, 255, 255, 0) 100%);
    --f-float-shadow: 0 22px 48px rgba(28, 40, 84, 0.13), 0 2px 6px rgba(28, 40, 84, 0.07);
    --f-primary-top: #10a98f;
    --f-primary-bottom: #007d69;
    --f-primary-ink: #ffffff;
  }
  /* ── F 토큰 끝 ── */

  /* 무대: 캔버스가 배경을 직접 그린다 */
  .mk-stage { background: var(--f-bg-edge); }

  /* 유리판: 위쪽 가장자리 빛, 안쪽 광택, 뒤 흐림 */
  .mk-glass, .mk-bar, .mk-tip, .mk-search input, .f-home, .f-tools .mk-btn {
    background: var(--f-sheen), var(--f-glass);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--f-glass-edge);
    box-shadow: inset 0 1px 0 var(--f-glass-top);
  }
  .mk-bar { border-width: 0 0 1px; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.02); }
  .mk-panel, .mk-results, .mk-tip { box-shadow: inset 0 1px 0 var(--f-glass-top), var(--f-float-shadow); }
  .mk-legend { box-shadow: inset 0 1px 0 var(--f-glass-top), 0 10px 30px rgba(0, 0, 0, 0.18); }

  .mk-title { font-size: 0.95rem; letter-spacing: -0.015em; display: flex; align-items: center; gap: 10px; }
  .f-mark {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff 0 12%, var(--cat-agents) 46%, var(--cat-physical-ai) 100%);
    box-shadow: 0 0 10px color-mix(in srgb, var(--cat-agents) 55%, transparent);
  }
  .mk-subtitle { letter-spacing: 0.005em; font-variant-numeric: tabular-nums; }
  .theme-toggle { background: var(--f-sheen), var(--f-glass); border-color: var(--f-glass-edge); box-shadow: inset 0 1px 0 var(--f-glass-top); }

  /* 견본 점: 작은 구슬 (overviews 고리, etc 빈 원은 mock-base 규칙이 이긴다) */
  .mk-swatch {
    background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.95) 0 14%, var(--c) 52%, color-mix(in srgb, var(--c) 70%, #000) 100%);
  }
  /* 고리 모양(overviews, etc)은 mock-base 의 inset 고리를 지키고 빛만 더한다 */
  :root:not([data-theme='light']) .mk-legend :not([data-cat='overviews']):not([data-cat='etc']) > .mk-swatch,
  :root:not([data-theme='light']) .mk-panel-cat:not([data-cat='overviews']):not([data-cat='etc']) .mk-swatch { box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
  :root:not([data-theme='light']) [data-cat='overviews'] > .mk-swatch { box-shadow: inset 0 0 0 2px var(--c), 0 0 8px color-mix(in srgb, var(--c) 45%, transparent); }

  #canvas { cursor: grab; }
  #canvas.is-panning { cursor: grabbing; }
  #canvas.is-over { cursor: pointer; }
  /* 캔버스가 무대를 꽉 채우므로 키보드 초점 테는 안쪽에 그린다 (바깥 테는 화면 밖으로 잘린다) */
  #canvas:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; border-radius: 0; }
  /* 숨긴 패널은 전환을 위해 transform 으로 밀어 두기만 하므로, 그 안의 버튼과 링크가 Tab 순서와 접근성 트리에 남지 않게 visibility 로도 숨긴다 */
  .mk-panel { transition: transform var(--dur-panel) var(--ease-out), opacity var(--dur-panel) var(--ease-out), visibility 0s linear 0s; }
  .mk-panel[hidden] { visibility: hidden; transition-delay: 0s, 0s, var(--dur-panel); }

  /* 검색 */
  .mk-search input { height: 38px; border-radius: 10px; letter-spacing: 0.005em; }
  .mk-search input:focus { border-color: color-mix(in srgb, var(--signal) 60%, transparent); box-shadow: inset 0 1px 0 var(--f-glass-top), 0 0 0 3px var(--signal-dim); }
  .mk-results { border-radius: 12px; }
  .mk-results:empty { display: none; }
  .mk-results .a-empty { cursor: default; color: var(--muted); }
  .mk-results .a-empty:hover { background: none; }
  .mk-results li .a-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mk-results mark { background: none; color: var(--c); font-weight: 650; }
  .mk-results li[aria-selected='true'], .mk-results li:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }

  /* 궤도 화면의 방문 경로: 검색 아래 한 줄 */
  .f-trail {
    top: calc(var(--space-4) + 38px + var(--space-2));
    left: var(--space-4);
    max-width: calc(100% - var(--panel-w) - 4 * var(--space-4));
    display: flex; align-items: center; gap: var(--space-2);
    height: 30px;
    font-size: var(--text-xs);
    overflow-x: auto; scrollbar-width: none;
  }
  .f-trail[hidden] { display: none; }
  .f-trail::-webkit-scrollbar { display: none; }
  .f-home {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 10px 0 8px;
    color: var(--text); font-weight: 600; font-size: var(--text-xs);
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .f-home:hover { border-color: color-mix(in srgb, var(--signal) 55%, transparent); }
  .f-home svg { width: 14px; height: 14px; color: var(--signal); }
  .f-trail ol { display: flex; align-items: center; margin: 0; padding: 0; list-style: none; }
  .f-trail li { display: flex; align-items: center; flex: none; }
  .f-trail li + li::before { content: '/'; color: var(--faint); padding: 0 4px; }
  .f-trail li button {
    display: inline-flex; align-items: center; gap: 6px; max-width: 170px;
    padding: 3px 6px; color: var(--muted); background: none; border: 0; border-radius: var(--radius-sm);
    cursor: pointer; white-space: nowrap;
  }
  .f-trail li button span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .f-trail li button:hover { color: var(--text); }
  .f-trail li[aria-current] button { color: var(--text); font-weight: 600; }
  .f-trail .trail-more { color: var(--faint); padding: 0 4px; }

  /* 좌하단 독: 범례와 조작 안내 */
  .f-dock { display: flex; align-items: flex-end; gap: var(--space-3); }
  .mk-stage > .f-dock { bottom: calc(var(--sheet, 0px) + var(--space-4)); }
  .mk-legend { width: 200px; border-radius: 14px; padding: 8px 12px; }
  .mk-legend li { user-select: none; border-radius: var(--radius-sm); outline-offset: 0; }
  .mk-legend li .a-name { letter-spacing: 0.005em; }
  .mk-legend li[aria-pressed='true'] .mk-legend-n { color: var(--c); }
  .mk-legend li[aria-pressed='true'] .mk-swatch { transform: scale(1.25); }
  .mk-legend .mk-swatch { transition: transform var(--dur-fast) var(--ease); }
  .f-hint { margin: 0 0 6px; font-size: var(--text-2xs); line-height: 1.75; color: var(--faint); }
  .f-hint kbd { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding: 0 4px; border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
  body:not([data-mode='orbit']) .f-hint.is-orbit, body[data-mode='orbit'] .f-hint.is-atlas { display: none; }
  .f-legend-reset { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--hairline); font-size: var(--text-2xs); color: var(--faint); cursor: default; }
  .f-legend-reset button { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .f-legend-reset[hidden] { display: none; }

  .f-tools { display: flex; gap: var(--space-2); }
  .f-tools .mk-btn { height: 32px; padding: 0 12px; font-weight: 550; font-size: var(--text-xs); }
  .f-tools .mk-btn[hidden] { display: none; }
  body[data-mode='orbit'] .f-tools { display: none; }

  /* 상세 패널 */
  .mk-panel { border-radius: 16px; }
  .mk-panel-title { font-size: 1.2rem; letter-spacing: -0.014em; line-height: 1.28; }
  .mk-panel-cat { letter-spacing: 0.01em; }
  .mk-panel-head, .mk-panel-foot { border-color: var(--hairline); }
  .mk-neighbors li { border-color: var(--hairline); outline-offset: -2px; padding: 6px 4px; margin: 0 -4px; border-radius: 6px; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
  .mk-neighbors li:hover { background: color-mix(in srgb, var(--c) 9%, transparent); }
  .mk-neighbors li .t { min-width: 0; }
  .nb-group { margin: var(--space-4) 0 var(--space-1); display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); font-weight: 600; }
  .nb-group .mk-deg { margin-left: auto; }
  .f-note { margin: var(--space-3) 0 0; color: var(--muted); font-size: var(--text-xs); line-height: 1.6; }
  .linkish { padding: 0; color: var(--signal); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .mk-btn { border-radius: 10px; }
  .mk-btn.is-primary, :root[data-theme='light'] .mk-btn.is-primary {
    color: var(--f-primary-ink);
    background: linear-gradient(180deg, var(--f-primary-top), var(--f-primary-bottom));
    border: 1px solid color-mix(in srgb, var(--f-primary-bottom) 80%, #000);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px color-mix(in srgb, var(--f-primary-bottom) 35%, transparent);
    letter-spacing: 0.005em;
  }
  .mk-btn.is-primary:hover, :root[data-theme='light'] .mk-btn.is-primary:hover { filter: brightness(1.06); background: linear-gradient(180deg, var(--f-primary-top), var(--f-primary-bottom)); }
  .mk-panel-foot .mk-btn.is-primary { flex: 1; }
  #panel-toggle { display: none; }

  /* 툴팁 */
  .mk-tip { border-radius: 10px; padding: 7px 11px 8px; }
  .mk-tip-title { letter-spacing: -0.005em; }

  /* 대체 목록: 스크립트나 CDN 라이브러리가 실패하면 보인다 */
  .f-fallback { display: none; position: absolute; inset: 0; overflow-y: auto; padding: var(--space-6) var(--space-4) var(--space-8); }
  body.is-fallback .f-fallback { display: block; }
  body.is-fallback .mk-stage > :not(.f-fallback) { display: none; }
  .f-fallback-lead { max-width: 60ch; margin: 0 0 var(--space-6); color: var(--muted); font-size: var(--text-sm); }
  .f-fallback-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--space-6) var(--space-8); }
  .f-fallback h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--space-2); font-family: var(--font-display); font-size: var(--text-base); letter-spacing: -0.01em; }
  .f-fallback h2 .mk-deg { margin-left: 2px; }
  .f-fallback ul { margin: 0; padding: 0; list-style: none; font-size: var(--text-sm); line-height: 1.35; }
  .f-fallback li { padding: 4px 0; border-bottom: 1px solid var(--hairline); }
  .f-fallback a { color: var(--text); text-decoration: none; }
  .f-fallback a:hover { color: var(--c); }

  /* 좁은 화면과 가로로 눕힌 휴대폰(높이 480px 이하)은 범례를 견본 한 줄로 접고 안내를 숨긴다. 세로 목록 범례는 낮은 화면에서 검색창과 궤도를 덮는다 */
  @media (max-width: 640px), (max-height: 480px) {
    .f-hint { display: none !important; }
    .mk-legend { width: auto; display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px; max-width: calc(100vw - 2 * var(--space-4) - 96px); }
    .mk-legend li { padding: 0; width: 26px; height: 26px; justify-content: center; }
    .mk-legend li .a-name, .mk-legend .mk-legend-n, .mk-legend .f-legend-reset { display: none; }
    .mk-legend li[aria-pressed='true'] { width: auto; padding: 0 9px 0 8px; gap: 6px; }
    .mk-legend li[aria-pressed='true'] .a-name { display: inline; font-size: var(--text-xs); color: var(--text); white-space: nowrap; }
    .mk-legend li .mk-swatch { width: 10px; height: 10px; }
    .mk-legend li[aria-pressed='true'] { background: color-mix(in srgb, var(--c) 22%, transparent); }
  }
  @media (max-height: 480px) and (min-width: 641px) {
    /* 옆 패널이 남는 가로 화면: 범례 줄이 패널 밑으로 들어가지 않게 패널 폭만큼 줄인다 */
    body[data-mode='orbit'] .mk-legend { max-width: calc(100vw - var(--panel-w) - 4 * var(--space-4)); }
  }
  @media (max-width: 640px) {
    .f-trail { max-width: calc(100% - 2 * var(--space-4)); }
    /* 누른 견본은 이름을 펼친다 (위 블록): 성운 이름이 자리를 못 찾아도 탭 한 번으로 카테고리를 읽는다 */
    .f-tools #reset-filter { display: none; }
    .mk-results { max-height: 40vh; }
    .mk-panel { border-radius: 16px 16px 0 0; }
    .mk-panel.is-peek .mk-panel-body { display: none; }
    /* 펼친 시트는 화면의 42%까지만. 궤도가 남은 자리에서 읽을 만한 크기를 지키고, 범례는 시트를 접을 때 돌아온다 */
    .mk-panel:not(.is-peek) { max-height: 42vh; }
    .mk-stage.is-sheet-full > .f-dock { display: none; }
    .mk-panel.is-peek .mk-panel-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--text-base); }
    .mk-panel-head { padding: var(--space-3) var(--space-4) var(--space-2); }
    .mk-panel-foot { padding: var(--space-2) var(--space-4) var(--space-3); }
    #panel-toggle { display: inline-flex; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3.0.1/dist/d3-dispatch.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3.0.1/dist/d3-quadtree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-timer@3.0.1/dist/d3-timer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-force@3.0.0/dist/d3-force.min.js"></script>
<script src="shared/graph-data.js"></script>
<script src="shared/mock-base.js"></script>
</head>
<body data-mode="atlas">
<header class="mk-bar">
  <h1 class="mk-title"><span class="f-mark" aria-hidden="true"></span>시안 F 성도와 궤도</h1>
  <span class="mk-subtitle" id="mk-stats"></span>
  <div class="mk-bar-end">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="테마 전환" aria-pressed="false">☀</button>
  </div>
</header>

<main class="mk-stage" id="stage">
  <canvas id="canvas" tabindex="0" aria-label="wiki 페이지 관계 그래프. 페이지를 고르면 그 페이지를 중심으로 이웃을 궤도에 놓는다. 방향키로 이동, Enter로 중심 옮기기, Esc로 전체 보기" aria-describedby="live"></canvas>
  <p class="mk-sr" id="live" aria-live="polite"></p>

  <div class="mk-float is-tl mk-search" id="search">
    <label class="mk-sr" for="q">페이지 검색</label>
    <input id="q" type="search" placeholder="페이지 제목으로 찾기  /" autocomplete="off" role="combobox" aria-controls="results" aria-expanded="false" aria-autocomplete="list">
    <ul class="mk-results mk-glass" id="results" role="listbox"></ul>
  </div>

  <nav class="mk-float f-trail" id="trail" aria-label="지나온 페이지" hidden>
    <button type="button" class="f-home" id="home" title="전체 보기로 돌아가기 (Esc)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="11" r="1.6" fill="currentColor"/><circle cx="8" cy="4.5" r="2" fill="currentColor"/><circle cx="12.5" cy="10" r="1.4" fill="currentColor"/><path d="M3.5 11 8 4.5l4.5 5.5" stroke="currentColor" stroke-width="0.9" fill="none" opacity="0.6"/></svg>
      전체 보기
    </button>
    <ol id="crumbs"></ol>
  </nav>

  <div class="mk-float is-bl f-dock" id="dock">
    <ul class="mk-glass mk-legend" id="legend" aria-label="카테고리 필터"></ul>
    <p class="f-hint is-atlas"><kbd>클릭</kbd> 궤도로 열기<br><kbd>휠</kbd> 확대, <kbd>드래그</kbd> 이동<br><kbd>/</kbd> 검색</p>
    <p class="f-hint is-orbit"><kbd>← →</kbd> 궤도를 돈다<br><kbd>↑ ↓</kbd> 안팎 궤도로 옮긴다<br><kbd>Enter</kbd> 중심에 둔다<br><kbd>Esc</kbd> 전체 보기</p>
  </div>

  <div class="mk-float is-br f-tools" id="tools">
    <button type="button" class="mk-btn" id="reset-filter" hidden>필터 해제</button>
    <button type="button" class="mk-btn" id="fit">화면 맞춤</button>
  </div>

  <div class="mk-tip" id="tip" hidden></div>

  <aside class="mk-panel mk-glass" id="panel" hidden aria-label="중심 페이지">
    <div class="mk-panel-head">
      <div style="display:flex;align-items:center;gap:var(--space-2)">
        <span class="mk-panel-cat" id="p-cat"><span class="mk-swatch"></span><span></span></span>
        <button type="button" class="mk-icon-btn" id="p-close" aria-label="전체 보기로 돌아가기" title="전체 보기로 돌아가기 (Esc)">×</button>
      </div>
      <h2 class="mk-panel-title" id="p-title"></h2>
      <div class="mk-panel-meta" id="p-meta"></div>
    </div>
    <div class="mk-panel-body" id="p-body"></div>
    <div class="mk-panel-foot">
      <a class="mk-btn is-primary" id="p-open" href="#">페이지 열기</a>
      <button type="button" class="mk-btn" id="panel-toggle" aria-expanded="false">이웃 보기</button>
    </div>
  </aside>

  <section class="f-fallback" id="fallback" aria-label="페이지 목록">
    <p class="f-fallback-lead" id="fallback-lead">관계 그래프를 그리지 못해 카테고리별 페이지 목록을 보여 준다. 네트워크가 연결되면 새로 고쳐 그래프를 연다.</p>
    <div class="f-fallback-grid" id="fallback-grid"></div>
  </section>
  <noscript><style>.mk-stage > :not(.f-fallback) { display: none; } .f-fallback { display: block; }</style><p style="padding:16px">스크립트가 꺼져 있어 그래프를 그리지 못한다. 사이트의 wiki 목록에서 페이지를 찾는다.</p></noscript>
</main>

<script>
// 대체 목록: d3-force 를 못 불러왔거나 그래프 스크립트가 실패하면 카테고리별 텍스트 목록으로 바꾼다
window.__fFallback = function (why) {
  document.body.classList.add('is-fallback');
  var d = window.GRAPH_DATA, grid = document.getElementById('fallback-grid');
  if (why) document.getElementById('fallback-lead').textContent = why;
  if (!d || grid.childElementCount) return;
  var cats = (window.Mock && Mock.CATEGORIES) || [];
  var order = cats.map(function (c) { return c.id; });
  var groups = {};
  d.nodes.forEach(function (n) { (groups[n.category] = groups[n.category] || []).push(n); });
  Object.keys(groups).forEach(function (c) { if (order.indexOf(c) < 0) order.push(c); });
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  grid.innerHTML = order.filter(function (c) { return groups[c]; }).map(function (c) {
    var meta = cats.filter(function (x) { return x.id === c; })[0];
    var list = groups[c].slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
    return '<div data-cat="' + c + '"><h2><span class="mk-swatch"></span>' + esc(meta ? meta.en : c) + '<span class="mk-deg">' + list.length + '</span></h2><ul>' +
      list.map(function (n) { return '<li><a href="../../wiki/' + esc(n.id) + '.md">' + esc(n.title) + '</a></li>'; }).join('') + '</ul></div>';
  }).join('');
};
</script>
<script>
(function () {
  'use strict';
  if (!window.GRAPH_DATA || !window.Mock) { window.__fFallback(); return; }
  if (!window.d3 || !d3.forceSimulation) {
    window.__fFallback('그래프 배치 라이브러리(d3-force)를 불러오지 못해 카테고리별 페이지 목록을 보여 준다. 네트워크가 연결되면 새로 고쳐 그래프를 연다.');
    return;
  }
  try { main(); } catch (err) { console.error(err); window.__fFallback(); }

function main() {
  var data = window.GRAPH_DATA;
  var nodes = data.nodes;
  var N = nodes.length;
  var reduce = Mock.reduceMotion();
  var TAU = Math.PI * 2, START = -Math.PI / 2;
  var CAP2 = 28;        // 바깥 궤도의 2-hop 상한. 넘치면 "+k"
  var TRACK = 24;       // 안쪽 궤도가 여러 겹일 때 겹 간격 (world)
  var LABEL_ROOM = 150; // 안쪽과 바깥 궤도 사이 라벨 자리 (world)
  var ATLAS = -2;       // n.role: 성도 화면. -1 궤도 화면의 배경, 0 중심, 1 이웃, 2 두 다리

  // ── 그래프 색인 (A) ───────────────────────────────────────────────────
  var byId = {}, CAT_ORDER = {};
  Mock.CATEGORIES.forEach(function (c, i) { CAT_ORDER[c.id] = i; });
  nodes.forEach(function (n, i) { n.i = i; n.nb = new Set(); n.out = new Set(); byId[n.id] = n; });
  var edges = [];
  data.edges.forEach(function (e) {
    var s = byId[e.source], t = byId[e.target];
    if (!s || !t || s === t) return;
    edges.push({ s: s, t: t });
    s.nb.add(t); t.nb.add(s); s.out.add(t);
  });
  var counts = {};
  nodes.forEach(function (n) { counts[n.category] = (counts[n.category] || 0) + 1; });
  document.getElementById('mk-stats').textContent = '페이지 ' + N + '개, 연결 ' + edges.length.toLocaleString() + '개';

  function baseR(n) { return Math.min(20, 2 + 1.6 * Math.sqrt(n.degree)); }
  function shortTitle(t) {
    var c = t.indexOf(':');
    if (c >= 2 && c <= 28 && !/[ㄱ-힝]/.test(t.slice(0, c))) return t.slice(0, c);
    return t.length > 28 ? t.slice(0, 27) + '…' : t;
  }
  function primaryTag(n) {
    for (var i = 0; i < n.tags.length; i++) if (n.tags[i] !== n.category && n.tags[i] !== 'physical-ai') return n.tags[i];
    return '';
  }
  nodes.forEach(function (n) { n.r = baseR(n); n.label = shortTitle(n.title); n.role = ATLAS; n.p = 1; n.lt = 1; n.front = false; });

  // ── 성도 배치 (A 그대로: 카테고리 성운 + 허브 뭉침 완화) ─────────────
  var ANCHOR = {
    'physical-ai': [-330, 10], llms: [-40, -300], agents: [300, -90], evaluations: [430, -330],
    applications: [210, 270], database: [470, 200], etc: [-30, 360], overviews: null,
  };
  var SUB = {
    vla: [0, 0], 'world-model': [-150, -150], manipulation: [-30, 175], humanoid: [130, 150],
    slam: [-200, 120], 'mobile-robot': [-200, 120], simulator: [-175, -10], benchmark: [120, -170],
    'robot-dataset': [120, -170], 'robot-learning': [-30, 175], 'imitation-learning': [-30, 175],
  };
  // shortcut: 세로 화면이면 성운 배치를 전치한다. 회전 시 다시 계산하지 않는다
  var portrait = window.innerWidth < window.innerHeight * 0.8;
  if (portrait) [ANCHOR, SUB].forEach(function (m) { Object.keys(m).forEach(function (k) { if (m[k]) m[k] = [m[k][1] * 1.15, m[k][0] * 0.85]; }); });
  nodes.forEach(function (n) {
    var a = ANCHOR[n.category];
    if (a && n.category === 'physical-ai') {
      var sub = n.tags.filter(function (g) { return g !== 'physical-ai'; })[0];
      var o = SUB[sub] || [0, 0];
      a = [a[0] + o[0], a[1] + o[1]];
    }
    n.ax = a ? a[0] : null; n.ay = a ? a[1] : null;
  });
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  nodes.forEach(function (n) {
    var cx = n.ax, cy = n.ay;
    if (cx == null) {
      cx = 0; cy = 0; var c = 0;
      n.nb.forEach(function (m) { if (ANCHOR[m.category]) { cx += ANCHOR[m.category][0]; cy += ANCHOR[m.category][1]; c++; } });
      if (c) { cx /= c; cy /= c; }
    }
    var a = rnd() * TAU, d = 20 + rnd() * 90;
    n.x = cx + Math.cos(a) * d; n.y = cy + Math.sin(a) * d;
  });
  var links = edges.map(function (e) { return { source: e.s, target: e.t }; });
  var sim = d3.forceSimulation(nodes)
    .force('charge', d3.forceManyBody().strength(function (n) { return -26 - 3.2 * n.degree; }).distanceMax(520).theta(0.85))
    .force('link', d3.forceLink(links)
      .distance(function (l) { return 26 + 5.5 * Math.sqrt(Math.max(l.source.degree, l.target.degree)); })
      .strength(function (l) {
        var hi = Math.max(l.source.degree, l.target.degree), lo = Math.min(l.source.degree, l.target.degree);
        var s = 0.7 / lo;
        if (hi >= 30) s *= 0.3;
        if (l.source.category !== l.target.category) s *= 0.35;
        return s;
      }))
    .force('x', d3.forceX(function (n) { return n.ax == null ? 0 : n.ax; }).strength(function (n) { return n.ax == null ? 0 : 0.11; }))
    .force('y', d3.forceY(function (n) { return n.ay == null ? 0 : n.ay; }).strength(function (n) { return n.ay == null ? 0 : 0.11; }))
    .force('collide', d3.forceCollide(function (n) { return n.r + 3.5; }).strength(0.9).iterations(2))
    .stop();
  var t0 = performance.now();
  for (var it = 0; it < 360; it++) sim.tick();
  var layoutMs = Math.round(performance.now() - t0);
  nodes.forEach(function (n) { n.hx = n.x; n.hy = n.y; n.vx = n.vy = 0; }); // 성도 위치 (home)

  var CAT_INFO = Mock.CATEGORIES.map(function (c) {
    var ns = nodes.filter(function (n) { return n.category === c.id; });
    var xs = ns.map(function (n) { return n.hx; }).sort(function (a, b) { return a - b; });
    var ys = ns.map(function (n) { return n.hy; }).sort(function (a, b) { return a - b; });
    return { id: c.id, en: c.en, n: ns.length, x: xs[xs.length >> 1], y: ys[ys.length >> 1], top: ys[0], bottom: ys[ys.length - 1], left: xs[0], right: xs[xs.length - 1] };
  });
  var rank = nodes.slice().sort(function (a, b) { return b.degree - a.degree; });
  rank.forEach(function (n, i) { n.rank = i; });

  // 엣지 묶음: 같은 카테고리 엣지는 그 색 실로, 카테고리를 넘는 엣지는 중성 실로 한 번에 긋는다
  var buckets = {};
  edges.forEach(function (e) { var key = e.s.category === e.t.category ? e.s.category : '_x'; (buckets[key] = buckets[key] || []).push(e); });
  var bucketKeys = Object.keys(buckets);

  // ── 캔버스, 토큰, 스프라이트 ─────────────────────────────────────────
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var panelEl = document.getElementById('panel');
  var W = 0, H = 0, dpr = 1;
  var cam = { x: 0, y: 0, k: 1 };
  var K_MIN = 0.2, K_MAX = 6;
  var T, F, sprites = {}, bgCanvas = null, dustPattern = null, haze = null;
  var dark = true;
  function isMobile() { return W <= 640; }

  function readF() {
    var cs = getComputedStyle(document.documentElement), g = function (n) { return cs.getPropertyValue(n).trim(); };
    return {
      bgCore: g('--f-bg-core'), bgEdge: g('--f-bg-edge'), vignette: g('--f-vignette'),
      dust: g('--f-dust'), dustAlpha: parseFloat(g('--f-dust-alpha')),
      backdrop: parseFloat(g('--f-backdrop-alpha')), lens: g('--f-lens'),
      blend: g('--f-filament-blend') || 'source-over', shadow: parseFloat(g('--f-shadow-alpha')),
    };
  }
  function rgbOf(c) {
    if (c.charAt(0) === '#') {
      if (c.length === 4) c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
      return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)];
    }
    var m = c.match(/[\d.]+/g) || [0, 0, 0];
    return [+m[0], +m[1], +m[2]];
  }
  function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')'; }
  function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  var WHITE = [255, 255, 255], BLACK = [0, 0, 0];

  // 노드 스프라이트: 카테고리마다 한 번 그려 두고 drawImage 로 붙인다 (프레임마다 그라데이션, shadowBlur 없음)
  var SR = 56; // 스프라이트 구 반지름 (px)
  function mk(size) { var c = document.createElement('canvas'); c.width = c.height = size; return c; }
  function buildSprites() {
    sprites = {};
    Mock.CATEGORIES.forEach(function (c) {
      var col = rgbOf(T.cat[c.id]);
      var S = SR * 2 + 8, o = S / 2;
      var core = mk(S), g = core.getContext('2d');
      var hollow = c.id === 'etc';
      var gr = g.createRadialGradient(o - SR * 0.34, o - SR * 0.4, SR * 0.04, o, o, SR);
      if (dark) {
        gr.addColorStop(0, rgba(mixc(col, WHITE, 0.72), 1));
        gr.addColorStop(0.32, rgba(mixc(col, WHITE, 0.18), 1));
        gr.addColorStop(0.78, rgba(col, 1));
        gr.addColorStop(1, rgba(mixc(col, BLACK, 0.38), 1));
      } else {
        gr.addColorStop(0, rgba(mixc(col, WHITE, 0.5), 1));
        gr.addColorStop(0.3, rgba(mixc(col, WHITE, 0.1), 1));
        gr.addColorStop(0.75, rgba(col, 1));
        gr.addColorStop(1, rgba(mixc(col, BLACK, 0.32), 1));
      }
      if (hollow) { // etc: 유리 고리 (모양으로도 구분)
        g.lineWidth = SR * 0.26; g.strokeStyle = gr;
        g.beginPath(); g.arc(o, o, SR * 0.86, 0, TAU); g.stroke();
      } else {
        g.fillStyle = gr; g.beginPath(); g.arc(o, o, SR, 0, TAU); g.fill();
        // 아래쪽 반사광 (에나멜이 바닥빛을 받는다)
        var b = g.createRadialGradient(o + SR * 0.15, o + SR * 0.62, 0, o + SR * 0.15, o + SR * 0.62, SR * 0.55);
        b.addColorStop(0, dark ? rgba(mixc(col, WHITE, 0.5), 0.35) : 'rgba(255,255,255,0.32)');
        b.addColorStop(1, 'rgba(255,255,255,0)');
        g.save(); g.beginPath(); g.arc(o, o, SR, 0, TAU); g.clip(); g.fillStyle = b; g.fillRect(0, 0, S, S); g.restore();
        // 가장자리 빛 테
        g.lineWidth = dark ? 2.2 : 3; g.strokeStyle = dark ? rgba(mixc(col, WHITE, 0.6), 0.35) : 'rgba(255,255,255,0.85)';
        g.beginPath(); g.arc(o, o, SR - (dark ? 1.2 : 1.6), 0, TAU); g.stroke();
      }
      // 반사 하이라이트
      var hx = o - SR * 0.33, hy = o - SR * 0.4;
      var sp = g.createRadialGradient(hx, hy, 0, hx, hy, SR * 0.36);
      sp.addColorStop(0, 'rgba(255,255,255,' + (dark ? 0.9 : 0.95) + ')');
      sp.addColorStop(0.45, 'rgba(255,255,255,' + (dark ? 0.28 : 0.4) + ')');
      sp.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sp; g.beginPath(); g.ellipse(hx, hy, SR * 0.36, SR * 0.28, -0.6, 0, TAU); g.fill();

      // 빛번짐 (dark) 또는 부드러운 그림자 (light)
      var HS = 128, ho = HS / 2, halo = mk(HS), h = halo.getContext('2d');
      var hg = h.createRadialGradient(ho, ho, 0, ho, ho, ho);
      if (dark) {
        hg.addColorStop(0, rgba(col, 0.55)); hg.addColorStop(0.22, rgba(col, 0.26));
        hg.addColorStop(0.5, rgba(col, 0.07)); hg.addColorStop(1, rgba(col, 0));
      } else {
        var ink = [24, 34, 72];
        hg.addColorStop(0, rgba(ink, 0.34)); hg.addColorStop(0.45, rgba(ink, 0.12)); hg.addColorStop(1, rgba(ink, 0));
      }
      h.fillStyle = hg; h.fillRect(0, 0, HS, HS);
      // light 허브의 색 오라 (에나멜이 바닥에 비친 색)
      var aura = null;
      if (!dark) {
        aura = mk(HS); var ag = aura.getContext('2d'), agr = ag.createRadialGradient(ho, ho, 0, ho, ho, ho);
        agr.addColorStop(0, rgba(col, 0.22)); agr.addColorStop(0.5, rgba(col, 0.06)); agr.addColorStop(1, rgba(col, 0));
        ag.fillStyle = agr; ag.fillRect(0, 0, HS, HS);
      }
      sprites[c.id] = { core: core, halo: halo, aura: aura, col: col, css: T.cat[c.id] };
    });
    // 허브의 렌즈 반짝임: 네 갈래 빛줄기
    var GS = 256, go = GS / 2, glint = mk(GS), gg = glint.getContext('2d');
    gg.globalCompositeOperation = 'lighter';
    [[1, 0.055], [0, 0.055]].forEach(function (v) {
      var lg = v[0] ? gg.createLinearGradient(0, go, GS, go) : gg.createLinearGradient(go, 0, go, GS);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.9)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      gg.fillStyle = lg;
      gg.beginPath();
      if (v[0]) { gg.moveTo(0, go); gg.lineTo(go, go - GS * v[1] / 2); gg.lineTo(GS, go); gg.lineTo(go, go + GS * v[1] / 2); }
      else { gg.moveTo(go, 0); gg.lineTo(go + GS * v[1] / 2, go); gg.lineTo(go, GS); gg.lineTo(go - GS * v[1] / 2, go); }
      gg.fill();
    });
    sprites._glint = glint;
  }

  // 배경: 깊은 남색 중심, 비네트, 별먼지 (dark) / 자기 표면, 미세한 결 (light). 크기가 바뀔 때만 다시 그린다
  function buildBackground() {
    bgCanvas = mk(1); bgCanvas.width = Math.max(1, Math.floor(W * dpr)); bgCanvas.height = Math.max(1, Math.floor(H * dpr));
    var g = bgCanvas.getContext('2d'), w = bgCanvas.width, h = bgCanvas.height;
    g.fillStyle = F.bgEdge; g.fillRect(0, 0, w, h);
    var R = Math.max(w, h) * 0.78;
    var rg = g.createRadialGradient(w * 0.46, h * 0.4, 0, w * 0.46, h * 0.4, R);

      var n = morph ? null : hitTest(p.x, p.y, 4), plus = !n && hitPlus(p.x, p.y);
      canvas.classList.toggle('is-over', !!n || plus);
      if (n !== hovered || plus !== hotPlus) { hovered = n; hotPlus = plus; redraw(); }
      if (n) showTip(n); else hideTip();
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    var p = local(e);
    pointers.delete(e.pointerId);
    canvas.classList.remove('is-panning');
    if (gesture && !gesture.moved && !gesture.pinch && e.type === 'pointerup') {
      var n = hitTest(p.x, p.y, gesture.type === 'mouse' ? 4 : 12);
      if (mode === 'atlas') { if (n) enterOrbit(n); }
      else if (n && n !== view.c) recenter(n.id);
      else if (n) { if (panelEl.classList.contains('is-peek') && mqMobile.matches) pToggle.click(); }
      else if (hitPlus(p.x, p.y)) toggleExpand();
      else if (focused) { focused = null; hideTip(); redraw(); }
    }
    if (pointers.size === 0) gesture = null;
    else if (pointers.size === 1) { var q = Array.from(pointers.values())[0]; gesture = { moved: true, sx: q.x, sy: q.y, cam: { x: cam.x, y: cam.y, k: cam.k } }; }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && !pointers.size) { hovered = null; hotPlus = false; hideTip(); canvas.classList.remove('is-over'); redraw(); }
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault(); flight = null;
    var p = local(e);
    var k = Math.max(K_MIN, Math.min(K_MAX, cam.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))));
    cam = camFor((p.x - cam.x) / cam.k, (p.y - cam.y) / cam.k, k, p.x, p.y);
    hideTip(); redraw();
  }, { passive: false });
  canvas.addEventListener('dblclick', function (e) {
    var p = local(e);
    if (hitTest(p.x, p.y, 4)) return;
    flyTo(mode === 'orbit' ? orbitCam(view) : fitTarget(nodes), 480);
  });

  // ── 툴팁: 노드 아래에 붙인다. 라벨은 노드 오른쪽 위라 겹치지 않는다 (A 수정) ─
  var tip = document.getElementById('tip');
  function showTip(n) {
    var meta = Mock.cat(n.category);
    var rel = mode === 'orbit' ? (n === view.c ? '<span>중심</span>' : n.role === 1 ? '<span>이웃</span>' : n.role === 2 ? '<span>두 다리 건너</span>' : '') : '';
    tip.innerHTML = '<div class="mk-tip-title">' + esc(n.title) + '</div><div class="mk-tip-meta" data-cat="' + n.category + '"><span class="mk-swatch"></span>' +
      meta.en + '<span>' + n.year + '</span><span>' + esc(n.type) + '</span><span>연결 ' + n.nb.size + '</span>' + rel + '</div>';
    tip.hidden = false;
    var p = S(n), r = nodeR(n), tw = tip.offsetWidth, th = tip.offsetHeight;
    var lx = p.x - 14, ly = p.y + r + 10;
    if (ly + th > H - 8) ly = p.y - r - 10 - th - 18; // 위로 뒤집을 때는 라벨 줄을 넘어서
    if (lx + tw > W - 8) lx = W - 8 - tw;
    tip.style.left = Math.max(8, lx) + 'px'; tip.style.top = Math.max(8, ly) + 'px';
  }
  function hideTip() { tip.hidden = true; }

  // ── 키보드 ────────────────────────────────────────────────────────
  function ringList(n) { return n.role === 2 ? view.r2 : view.r1; }
  function nearest(list, ang) {
    var best = null, bd = Infinity;
    list.forEach(function (m) {
      var d = Math.abs(((view.pos.get(m.id).ang - ang) % TAU + TAU * 1.5) % TAU - TAU / 2);
      if (d < bd) { bd = d; best = m; }
    });
    return best;
  }
  function setFocus(n) {
    focused = n; hovered = null;
    if (n) { showTip(n); document.getElementById('live').textContent = n.title + ', ' + Mock.cat(n.category).en; } else hideTip();
    redraw();
  }
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT') return;
    if (e.key === '/') { e.preventDefault(); q.focus(); return; }
    var onChrome = document.activeElement && document.activeElement !== canvas && document.activeElement !== document.body;
    if (e.key === 'Escape') {
      if (mode === 'orbit') { if (focused) setFocus(null); else exitOrbit(); }
      else if (filter.size) { filter.clear(); syncLegend(); redraw(); }
      return;
    }
    if (onChrome) return;
    if (mode === 'atlas') {
      if (/^Arrow/.test(e.key)) { e.preventDefault(); enterOrbit(rank[0]); }
      return;
    }
    if (e.key === 'Backspace') { e.preventDefault(); back(); return; }
    var cur = focused, ring = cur ? cur.role : 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      if (ring === 0) { if (view.r1.length) setFocus(view.r1[e.key === 'ArrowRight' ? 0 : view.r1.length - 1]); return; }
      var list = ringList(cur), i = list.indexOf(cur) + (e.key === 'ArrowRight' ? 1 : -1);
      setFocus(list[(i + list.length) % list.length]);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (ring === 0) { if (view.r1.length) setFocus(nearest(view.r1, Math.PI / 2)); }
      else if (ring === 1 && view.r2.length) setFocus(nearest(view.r2, view.pos.get(cur.id).ang));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (ring === 2) setFocus(nearest(view.r1, view.pos.get(cur.id).ang));
      else if (ring === 1) setFocus(null);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (cur && cur !== view.c) recenter(cur.id); else location.href = pageHref(view.c);
    }
  });

  // ── 범례 필터 ──────────────────────────────────────────────────────
  var legend = document.getElementById('legend'), resetBtn = document.getElementById('reset-filter');
  legend.innerHTML = Mock.CATEGORIES.map(function (c) {
    return '<li data-cat="' + c.id + '" tabindex="0" role="button" aria-pressed="false" title="' + c.en + ', ' + c.ko + '만 강조">' +
      '<span class="mk-swatch"></span><span class="a-name">' + c.en + '</span><span class="mk-legend-n">' + (counts[c.id] || 0) + '</span></li>';
  }).join('') + '<li class="f-legend-reset" id="legend-reset" hidden><button type="button">필터 해제</button></li>';
  function syncLegend() {
    legend.querySelectorAll('li[data-cat]').forEach(function (li) { li.setAttribute('aria-pressed', String(filter.has(li.dataset.cat))); });
    resetBtn.hidden = !filter.size;
    document.getElementById('legend-reset').hidden = !filter.size;
  }
  function toggleCat(id) { if (filter.has(id)) filter.delete(id); else filter.add(id); legendHover = null; syncLegend(); redraw(); }
  function clearFilter() { filter.clear(); syncLegend(); redraw(); }
  legend.addEventListener('click', function (e) {
    if (e.target.closest('#legend-reset')) { clearFilter(); return; }
    var li = e.target.closest('li[data-cat]'); if (li) toggleCat(li.dataset.cat);
  });
  legend.addEventListener('keydown', function (e) {
    var li = e.target.closest('li[data-cat]');
    if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); toggleCat(li.dataset.cat); }
  });
  legend.addEventListener('pointerover', function (e) {
    if (e.pointerType !== 'mouse') return;
    var li = e.target.closest('li[data-cat]'), c = li && !filter.size ? li.dataset.cat : null;
    if (c !== legendHover) { legendHover = c; redraw(); }
  });
  legend.addEventListener('pointerleave', function () { legendHover = null; redraw(); });
  resetBtn.addEventListener('click', clearFilter);
  document.getElementById('fit').addEventListener('click', function () {
    flyTo(fitTarget(filter.size ? nodes.filter(function (n) { return filter.has(n.category); }) : nodes), 480);
  });

  // ── 검색 (A) ──────────────────────────────────────────────────────
  var q = document.getElementById('q'), results = document.getElementById('results');
  var hits = [], active = -1;
  function runSearch() {
    var s = q.value.trim().toLowerCase();
    searchHits = new Set();
    if (!s) { hits = []; renderResults(); redraw(); return; }
    hits = nodes.map(function (n) {
      var t = n.title.toLowerCase(), i = t.indexOf(s);
      if (i < 0 && n.stem.indexOf(s) < 0) return null;
      return { n: n, score: (i === 0 ? 1000 : i > 0 ? 500 : 0) + n.degree, at: i };
    }).filter(Boolean).sort(function (a, b) { return b.score - a.score; });
    hits.slice(0, 40).forEach(function (h) { searchHits.add(h.n); });
    active = hits.length ? 0 : -1;
    renderResults(); redraw();
  }
  function renderResults() {
    var s = q.value.trim();
    if (!s) { results.innerHTML = ''; q.setAttribute('aria-expanded', 'false'); return; }
    q.setAttribute('aria-expanded', 'true');
    if (!hits.length) { results.innerHTML = '<li class="a-empty">일치하는 페이지가 없다. 영문 제목이나 파일 이름으로 찾아 본다</li>'; return; }
    results.innerHTML = hits.slice(0, 8).map(function (h, i) {
      var t = h.n.title, title = h.at >= 0 ? esc(t.slice(0, h.at)) + '<mark>' + esc(t.slice(h.at, h.at + s.length)) + '</mark>' + esc(t.slice(h.at + s.length)) : esc(t);
      return '<li role="option" id="r' + i + '" data-cat="' + h.n.category + '" data-id="' + esc(h.n.id) + '" aria-selected="' + (i === active) + '">' +
        '<span class="mk-swatch"></span><span class="a-t">' + title + '</span><span class="mk-deg">' + h.n.degree + '</span></li>';
    }).join('');
    q.setAttribute('aria-activedescendant', active >= 0 ? 'r' + active : '');
  }
  function pick(n) {
    q.value = ''; hits = []; searchHits = new Set(); renderResults();
    if (filter.size && !filter.has(n.category)) { filter.clear(); syncLegend(); }
    q.blur(); canvas.focus({ preventScroll: true });
    recenter(n.id);
  }
  q.addEventListener('input', runSearch);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var m = Math.min(hits.length, 8); if (!m) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + m) % m; renderResults();
    } else if (e.key === 'Enter' && active >= 0 && hits[active]) { e.preventDefault(); e.stopPropagation(); pick(hits[active].n); } // 포커스가 캔버스로 옮겨 가므로 문서 Enter(페이지 열기)까지 번지지 않게 막는다
    else if (e.key === 'Escape') { e.stopPropagation(); q.value = ''; runSearch(); q.blur(); canvas.focus({ preventScroll: true }); }
  });
  results.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  results.addEventListener('click', function (e) { var li = e.target.closest('li[data-id]'); if (li) pick(byId[li.dataset.id]); });

  // ── 시작 ──────────────────────────────────────────────────────────
  Mock.onTheme(applyTheme);
  window.addEventListener('resize', resize);
  mqMobile.addEventListener('change', function (e) { panelEl.classList.toggle('is-peek', e.matches); syncSheet(); });
  T = Mock.readTokens(); F = readF(); dark = T.theme === 'dark';
  buildSprites(); buildHaze();
  var r0 = canvas.getBoundingClientRect(); W = r0.width; H = r0.height;
  resize();
  cam = fitTarget(nodes);
  var startId = readHash();
  if (startId && byId[startId]) {
    revealT0 = -1; // 딥링크는 곧바로 궤도로 연다. 성도 등장 연출은 건너뛴다
    atlasCam = { x: cam.x, y: cam.y, k: cam.k };
    history.replaceState(null, '', location.pathname + location.search);
    enterOrbit(byId[startId], { instant: true });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitCache.clear(); syncSheet(); if (mode === 'orbit' && view && !morph) cam = orbitCam(view); redraw(); });

  // 검증용 노출 (시안 전용)
  window.__f = {
    nodes: nodes, layoutMs: layoutMs, byId: byId,
    mode: function () { return mode; }, cam: function () { return { x: cam.x, y: cam.y, k: cam.k }; },
    busy: function () { return !!(morph || flight || rafId); },
    select: function (id) { recenter(id); }, exit: function () { exitOrbit(); },
    view: function () { return view && { cid: view.cid, r1: view.r1.length, r2: view.r2.length, hidden: view.hidden, labels: orbitLabelCount }; },
    drawTimes: drawTimes,
    names: function () { return nameBoxes.map(function (b) { return b.id; }); }, centerBoxes: function () { return centerBoxes; },
    // 겹침 검사용: 이름 상자, 알약, 궤도 라벨, 크롬, 보이는 노드 원 (화면 좌표, 스프라이트 테 포함)
    geom: function () {
      return {
        names: nameBoxes, pill: pillBox, labels: mode === 'orbit' ? labelBoxes : [], chrome: chromeRects(),
        nodes: nodes.filter(function (n) { return mode === 'atlas' ? n.role === ATLAS : n.role >= 0; }).map(function (n) {
          var p = S(n), r = nodeR(n) * 1.08 + (n.category === 'overviews' ? 3.1 : 0);
          return { x: p.x, y: p.y, r: r, cat: n.category, id: n.id };
        }),
      };
    },
  };
}
})();
</script>
</body>
</html>
